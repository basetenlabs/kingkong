name: Build nightly wheels and publish to PyTorch Index

on:
  push:
    branches:
      - nightly
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  generate-matrix:
    if: github.repository_owner == 'pytorch'
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@8f7de1607e504c372169e13a70dc1d357424a23d # main
    with:
      package-type: wheel
      os: linux
      test-infra-repository: pytorch/test-infra
      test-infra-ref: 8f7de1607e504c372169e13a70dc1d357424a23d
      with-cuda: enable
      with-rocm: enable
      python-versions: '["3.10", "3.11", "3.12"]'
  build:
    needs: generate-matrix
    name: ${{ matrix.repository }}
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@8f7de1607e504c372169e13a70dc1d357424a23d # main
    strategy:
      fail-fast: false
    with:
      repository: pytorch/torchtitan
      ref: ""
      test-infra-repository: pytorch/test-infra
      test-infra-ref: 8f7de1607e504c372169e13a70dc1d357424a23d
      package-name: torchtitan
      build-matrix: ${{ needs.generate-matrix.outputs.matrix }}
      pre-script: .github/scripts/update_version.sh
      trigger-event: ${{ github.event_name }}
      build-platform: 'python-build-package'
